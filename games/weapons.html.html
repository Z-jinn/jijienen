<title>武器图鉴</title>
<style>
 body {

  flex-direction: column;

  .main-wrapper { width: 100%; max-width: 750px; }
  .search-wrapper { margin-bottom: 20px; }

  .weapon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
  .grid-item { background: #2a2b36; border: 1px solid #3b3c4a; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

  .grid-img-box .placeholder { font-size: 12px; color: #6a6b7c; }
  .grid-name { color: #fff; font-size: 14px; font-weight: bold; text-align: center; word-break: break-all; }

  .weapon-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box; }

  .weapon-img-box .placeholder { font-size: 14px; color: #aaa; }
  .weapon-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 15px; font-size: 13px; }

  .stat-row .value { color: #111; font-weight: bold; text-align: right; }
  .stat-row .empty { color: #999; font-style: italic; font-weight: normal; }
  .weapon-tags-section { padding: 12px 15px; background: #eaebf0; border-bottom: 1px solid #d0d1db; font-size: 14px; line-height: 1.8; }
  .weapon-source-section { padding: 12px 15px; background: #eaebf0; border-bottom: 1px solid #d0d1db; font-size: 14px; line-height: 1.8; }

  .tag-title { color: #e64b4b; font-weight: bold; margin-right: 5px; }
  .tag-title.blue { color: #3b7bc3; }
  .tag-desc { color: #444; }
  .mod-slot { display: flex; margin-bottom: 10px; }
  .mod-slot:last-child { margin-bottom: 0; }
  .mod-slot-label { color: #6a5b8e; font-weight: bold; min-width: 58px; flex-shrink: 0; }
  .mod-slot-content { flex: 1; }

  .mod-name { color: #3b7bc3; font-weight: bold; }
  .mod-source { color: #999; font-size: 12px; font-weight: normal; margin-left: 4px; }
  .mod-effect { color: #333; padding-left: 5px; display: block; }
  .mod-empty { color: #999; font-style: italic; }

function renderGrid(data = weaponData) {
  const grid = document.getElementById('weapon-grid');
  if (!grid) return;
  if (data.length === 0) {
    grid.innerHTML = '<div class="no-result">未找到匹配的武器，请尝试其他关键字。</div>';
    return;
  }
  let html = '';
  data.forEach((weapon) => {
    let imgHtml = '';
    if (weapon.imgUrl && weapon.imgUrl.trim() !== "") {
      imgHtml = `<img src="${weapon.imgUrl}" alt="${weapon.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>暂无图片</span>';">`;
    } else {
      imgHtml = `<span class="placeholder">暂无图片</span>`;
    }
    html += `<div class="grid-item" onclick="openWeaponDetail('${weapon.name}')"><div class="grid-img-box">${imgHtml}</div><div class="grid-name">${weapon.name}</div></div>`;
  });
  grid.innerHTML = html;
}

function openWeaponDetail(weaponName) {
  const weapon = weaponData.find(w => w.name === weaponName);
  if (!weapon) return;

  let imgHtml = '';
  if (weapon.imgUrl && weapon.imgUrl.trim() !== "") {
    imgHtml = `<img src="${weapon.imgUrl}" alt="${weapon.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>暂无图片</span>';">`;
  } else {
    imgHtml = `<span class="placeholder">暂无图片</span>`;
  }

  let statsHtml = '';
  weapon.stats.forEach(s => {
    let valClass = (!s.value || s.value === '') ? 'value empty' : 'value';
    statsHtml += `<div class="stat-row"><span class="label">${s.label}</span><span class="${valClass}">${s.value || '--'}</span></div>`;
  });

  let tagsHtml = '';
  weapon.tags.forEach(t => {
    tagsHtml += `<div class="tag-row"><span class="tag-title ${t.color === 'blue' ? 'blue' : ''}">${t.title}</span><span class="tag-desc">${t.desc}</span></div>`;
  });

  let sourceHtml = `<div style="color: #444;">${weapon.source || '--'}</div>`;

  let modsHtml = '';
  for (let i = 0; i < 4; i++) {
    const slot = (weapon.mods && weapon.mods[i]) ? weapon.mods[i] : [];
    let slotContent = '';
    if (slot.length === 0) {
      slotContent = '<span class="mod-empty">--</span>';
    } else {
      slotContent = slot.map(m => {
        let sourcePart = m.source ? `<span class="mod-source">（获取途径：${m.source}）</span>` : '';
        let effectsPart = m.effects.map(e => `<span class="mod-effect">${e}</span>`).join('');
        return `<div class="mod-item"><span class="mod-name">${m.name}</span>${sourcePart}${effectsPart}</div>`;
      }).join('');
    }
    modsHtml += `<div class="mod-slot"><span class="mod-slot-label">配件${i + 1}：</span><div class="mod-slot-content">${slotContent}</div></div>`;
  }

  const modalCard = document.getElementById('modalCard');
  modalCard.innerHTML = `
    <div class="weapon-header">${weapon.name}<span class="close-btn" onclick="closeModal()">×</span></div>
    <div class="weapon-top"><div class="weapon-img-box">${imgHtml}</div><div class="weapon-stats">${statsHtml}</div></div>
    <div class="weapon-tags-section"><div class="section-title">词条效果</div>${tagsHtml}</div>
    <div class="weapon-source-section"><div class="section-title">获取途径</div>${sourceHtml}</div>
    <div class="weapon-mods-section"><div class="section-title">配件及效果</div>${modsHtml}</div>
  `;

  document.getElementById('weaponModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('weaponModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  const keyword = e.target.value.toLowerCase().trim();
  const filteredData = weaponData.filter(weapon => weapon.name.toLowerCase().includes(keyword));
  renderGrid(filteredData);
});

window.onload = () => renderGrid();
</script>
