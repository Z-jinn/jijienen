<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合成大作战 · Jinn Box</title>
<!-- 引入物理引擎 Matter.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  /* ===== 基础重置 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { min-height: 100%; }

  body {
    background: #1a1b23;
    color: #e8ecf7;
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 110px 20px 20px !important; /* 留出顶部导航栏高度 */
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ===== 统一导航栏 (匹配主页) ===== */
  .jinn-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(10, 13, 21, .94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    text-align: center; padding: 14px 0;
  }
  .jinn-brand {
    font-size: 24px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg, #fff, #8ea8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .jinn-nav {
    position: fixed; top: 60px; left: 0; right: 0; z-index: 9998;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    background: rgba(10, 13, 21, .88);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
  }
  .jinn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .14);
    color: #e8ecf7; font-size: 13px; font-weight: 700; text-decoration: none;
    transition: background .15s;
  }
  .jinn-back:hover { background: rgba(255, 255, 255, .18); }
  .jinn-page-title { font-size: 14px; font-weight: 700; opacity: .85; }

  /* ===== 游戏布局 ===== */
  .main-container {
    display: grid;
    grid-template-columns: auto minmax(320px, 380px) auto;
    grid-template-rows: auto;
    gap: 16px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding-top: 10px;
  }

  .panel {
    display: flex;
    height: 100%;
  }
  .left-panel { justify-content: flex-end; }
  .right-panel { justify-content: flex-start; }

  /* 分数板 */
  .score-board {
    background: rgba(42, 43, 54, .9);
    border: 1px solid #3b3c4a;
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    min-width: 74px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, .35);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .score-label { font-size: 12px; color: #8a8ba0; letter-spacing: 1px; }
  .score-value { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.1; }
  .highest-score {
    margin-top: 4px;
    border-top: 1px solid rgba(255, 255, 255, .08);
    padding-top: 6px;
  }
  .highest-score .score-value { font-size: 16px; color: #b9aede; }

  /* 下一个水果预览 */
  .next-preview {
    background: rgba(42, 43, 54, .9);
    border: 1px solid #3b3c4a;
    border-radius: 10px;
    padding: 10px;
    width: 74px;
    height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, .35);
  }
  .next-label { font-size: 12px; color: #8a8ba0; letter-spacing: 1px; }
  .next-ball-preview {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid rgba(255, 255, 255, .15);
    transition: all .2s;
  }

  /* 游戏画板 */
  .game-board {
    position: relative;
    width: 100%;
    height: calc(100vh - 150px);
    min-height: 450px;
    max-height: 700px;
    background: linear-gradient(180deg, #2f3040 0%, #24252f 100%);
    border-radius: 16px;
    overflow: hidden;
    cursor: crosshair;
    box-shadow: 0 0 0 1px #3b3c4a, 0 18px 40px rgba(0, 0, 0, .55), inset 0 0 25px rgba(0, 0, 0, .55);
  }
  .game-board canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  /* 危险判定线 */
  .danger-line {
    position: absolute;
    top: 150px;
    left: 0;
    width: 100%;
    height: 0;
    border-top: 2px dashed rgba(255, 90, 90, .45);
    pointer-events: none;
    z-index: 4;
    transition: border-color .25s;
  }
  .danger-line.danger {
    border-top: 2px solid #ff4d4d;
    animation: dangerPulse .5s infinite alternate;
    box-shadow: 0 0 12px rgba(255, 77, 77, .7);
  }
  @keyframes dangerPulse { from { opacity: .35; } to { opacity: 1; } }

  /* 弹幕 */
  .danmu {
    position: absolute; left: 100%; top: 35%; white-space: nowrap;
    font-size: 22px; font-weight: 900; color: #ffd700; letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 200, 0, .9), 0 2px 6px rgba(0, 0, 0, .9);
    pointer-events: none; z-index: 30; opacity: 0;
    transition: transform 3.2s linear, opacity .4s ease; will-change: transform;
  }

  /* 游戏结束提示 */
  .game-over {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(26, 27, 35, .94); border: 1px solid #6a5b8e;
    padding: 22px 40px; border-radius: 14px; font-size: 22px; font-weight: 900;
    color: #fff; display: none; pointer-events: auto; cursor: pointer;
    text-align: center; z-index: 20; box-shadow: 0 15px 40px rgba(0, 0, 0, .7);
  }
  .game-over span { font-size: 13px; color: #8a8ba0; font-weight: 400; }

  /* ===== 小屏适配 ===== */
  @media (max-width: 640px) {
    body {
      padding: 100px 12px 12px !important;
    }
    .main-container {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 10px;
      padding-top: 0;
    }
    .left-panel {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      justify-content: flex-start;
    }
    .right-panel {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      justify-content: flex-end;
    }
    .game-board {
      grid-column: 1 / 3;
      grid-row: 2 / 3;
      height: calc(100vh - 200px);
      min-height: 400px;
    }
    .score-board {
      flex-direction: row;
      width: 100%;
      padding: 8px 12px;
      justify-content: flex-start;
      gap: 16px;
    }
    .highest-score {
      margin-top: 0;
      border-top: none;
      border-left: 1px solid rgba(255, 255, 255, .1);
      padding-top: 0;
      padding-left: 16px;
    }
    .next-preview {
      height: 100%;
      flex-direction: row;
      width: auto;
      gap: 10px;
      padding: 8px 12px;
    }
    .danmu { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ================= 统一顶部导航栏 ================= -->
<div class="jinn-header">
  <div class="jinn-brand">Jinn Box</div>
</div>

<div class="jinn-nav">
  <a class="jinn-back" href="index.html">← 返回</a>
  <span class="jinn-page-title">合成大作战</span>
</div>
<!-- ================================================== -->

<!-- ================= 游戏区域 ================= -->
<div class="main-container">
  <div class="panel left-panel">
    <div class="score-board">
      <div class="score-label">分数</div>
      <div class="score-value" id="score">0</div>
      <div class="highest-score">
        <div class="score-label">最高</div>
        <div class="score-value" id="highScore">0</div>
      </div>
    </div>
  </div>
  
  <div class="game-board" id="gameBoard">
    <div class="danger-line" id="dangerLine"></div>
    <div class="game-over" id="gameOver">游戏结束<br><span>点击重新开始</span></div>
  </div>
  
  <div class="panel right-panel">
    <div class="next-preview">
      <div class="next-label">下一个</div>
      <div class="next-ball-preview" id="nextBall"></div>
    </div>
  </div>
</div>

<script>
/* 脚本部分保持原有的逻辑，仅做必要的兼容性微调 */
/* =========================================================================
   图片配置区
   ========================================================================= */
const IMAGE_CONFIG = {
    0: '../images/dg.jpg',
    1: '../images/lc.jpg',
    2: '../images/zg.jpg',
    3: '../images/xkd.jpg',
    4: '../images/xh.jpg',
    5: '../images/lq.jpg',
    6: '../images/bq.jpg',
    7: '../images/ksd.jpg'
};
/* ========================================================================= */

const TOP_MERGE_TEXT  = '恭喜你合成了滚木';
const TOP_MERGE_SCORE = 100;

const ballTypes = [
    { level: 0, radius: 15, color: '#f1c40f', score: 1  },
    { level: 1, radius: 22, color: '#e67e22', score: 3  },
    { level: 2, radius: 30, color: '#e74c3c', score: 6  },
    { level: 3, radius: 38, color: '#9b59b6', score: 10 },
    { level: 4, radius: 48, color: '#3498db', score: 15 },
    { level: 5, radius: 58, color: '#2ecc71', score: 21 },
    { level: 6, radius: 70, color: '#f1c40f', score: 28 },
    { level: 7, radius: 82, color: '#e67e22', score: 36 }
];

const loadedImages = {};

function loadImage(url) {
    return new Promise((resolve) => {
        if (!url) return resolve(null);
        const img = new Image();
        img.src = url;
        img.onload = () => resolve(img);
        img.onerror = () => {
            console.warn(`图片加载失败: ${url}`);
            resolve(null);
        };
    });
}

const Engine = Matter.Engine,
      Render = Matter.Render,
      Runner = Matter.Runner,
      Bodies = Matter.Bodies,
      Composite = Matter.Composite,
      Events = Matter.Events;

const engine = Engine.create();
const world = engine.world;
engine.gravity.y = 1.2;

const board = document.getElementById('gameBoard');
// 为了确保在小屏手机或者刚加载时能正确获取到尺寸，这里读取 clientWidth / clientHeight
const width = board.clientWidth;
const height = board.clientHeight;
const dangerLineEl = document.getElementById('dangerLine');
const dangerLine = 150;

const render = Render.create({
    element: board,
    engine: engine,
    options: {
        width: width,
        height: height,
        wireframes: false,
        background: 'transparent'
    }
});

Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

const wallOptions = { isStatic: true, render: { visible: false } };
Composite.add(world, [
    Bodies.rectangle(-25, height / 2, 50, height, wallOptions),
    Bodies.rectangle(width + 25, height / 2, 50, height, wallOptions),
    Bodies.rectangle(width / 2, height + 25, width, 50, wallOptions)
]);

let score = 0;
let highScore = localStorage.getItem('jinnBoxHighScore') || 0;
let currentType = Math.floor(Math.random() * 5);
let nextType = Math.floor(Math.random() * 5);
let currentBall = null;
let canDrop = true;
let isGameOver = false;

document.getElementById('highScore').innerText = highScore;

function addScore(points) {
    score += points;
    document.getElementById('score').innerText = score;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('jinnBoxHighScore', highScore);
        document.getElementById('highScore').innerText = highScore;
    }
}

function showDanmu(text) {
    const el = document.createElement('div');
    el.className = 'danmu';
    el.textContent = text;
    el.style.top = (30 + Math.random() * 25) + '%';
    board.appendChild(el);
    const distance = board.clientWidth + el.offsetWidth;
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            el.style.transform = `translateX(-${distance}px)`;
            el.style.opacity = '1';
        });
    });
    setTimeout(() => el.remove(), 3600);
}

function createReadyBall() {
    if (isGameOver) return;
    const type = ballTypes[currentType];
    const renderOptions = {};

    if (loadedImages[currentType]) {
        renderOptions.visible = false;
    } else {
        renderOptions.fillStyle = type.color;
    }

    const startY = Math.min(50, dangerLine - type.radius - 20);

    currentBall = Bodies.circle(width / 2, startY, type.radius, {
        restitution: 0.3,
        friction: 0.5,
        density: 0.05,
        label: 'ball',
        isStatic: true,
        render: renderOptions
    });
    currentBall.level = currentType;
    Composite.add(world, currentBall);
    updateNextPreview();
}

function updateNextPreview() {
    const nextTypeData = ballTypes[nextType];
    const nextPreviewElement = document.getElementById('nextBall');
    
    if (loadedImages[nextType]) {
        nextPreviewElement.style.backgroundImage = `url(${loadedImages[nextType].src})`;
        nextPreviewElement.style.backgroundColor = 'transparent';
    } else {
        nextPreviewElement.style.backgroundImage = 'none';
        nextPreviewElement.style.backgroundColor = nextTypeData.color;
    }
    const size = Math.max(20, Math.min(40, nextTypeData.radius * 1.5));
    nextPreviewElement.style.width = size + 'px';
    nextPreviewElement.style.height = size + 'px';
}

function handleMove(clientX) {
    if (!currentBall || !canDrop || isGameOver) return;
    const rect = board.getBoundingClientRect();
    let mouseX = clientX - rect.left;
    const r = currentBall.circleRadius;
    if (mouseX < r + 10) mouseX = r + 10;
    if (mouseX > width - r - 10) mouseX = width - r - 10;
    Matter.Body.setPosition(currentBall, { x: mouseX, y: currentBall.position.y });
    Matter.Body.setVelocity(currentBall, { x: 0, y: 0 });
}

board.addEventListener('mousemove', (e) => handleMove(e.clientX));
board.addEventListener('touchmove', (e) => {
    if (e.cancelable) e.preventDefault();
    handleMove(e.touches[0].clientX);
}, { passive: false });

board.addEventListener('mousedown', dropBall);
board.addEventListener('touchstart', (e) => {
    if (e.target.tagName !== 'BUTTON') dropBall();
});

function dropBall() {
    if (!currentBall || !canDrop || isGameOver) return;
    canDrop = false;
    Matter.Body.setStatic(currentBall, false);
    currentBall = null;
    setTimeout(() => {
        currentType = nextType;
        const maxLevel = Math.min(5, Math.floor(score / 50) + 3);
        nextType = Math.floor(Math.random() * maxLevel);
        createReadyBall();
        canDrop = true;
    }, 500);
}

Events.on(engine, 'collisionStart', (event) => {
    const pairs = event.pairs;
    for (let i = 0; i < pairs.length; i++) {
        const bodyA = pairs[i].bodyA;
        const bodyB = pairs[i].bodyB;

        if (bodyA.label === 'ball' && bodyB.label === 'ball' &&
            bodyA.level === bodyB.level && bodyA.id !== bodyB.id) {
            if (bodyA.isMerged || bodyB.isMerged) continue;
            const newLevel = bodyA.level + 1;

            if (newLevel >= ballTypes.length) {
                bodyA.isMerged = true;
                bodyB.isMerged = true;
                Composite.remove(world, bodyA);
                Composite.remove(world, bodyB);
                addScore(TOP_MERGE_SCORE);
                showDanmu(TOP_MERGE_TEXT);
                continue;
            }

            bodyA.isMerged = true;
            bodyB.isMerged = true;
            const newX = (bodyA.position.x + bodyB.position.x) / 2;
            const newY = (bodyA.position.y + bodyB.position.y) / 2;
            Composite.remove(world, bodyA);
            Composite.remove(world, bodyB);

            const typeData = ballTypes[newLevel];
            const renderOptions = {};
            if (loadedImages[newLevel]) {
                renderOptions.visible = false;
            } else {
                renderOptions.fillStyle = typeData.color;
            }

            const newBall = Bodies.circle(newX, newY, typeData.radius, {
                restitution: 0.3,
                friction: 0.5,
                density: 0.05,
                label: 'ball',
                render: renderOptions
            });
            newBall.level = newLevel;
            Composite.add(world, newBall);
            addScore(ballTypes[newLevel - 1].score);
        }
    }
});

let dangerTimer = 0;
Events.on(engine, 'beforeUpdate', () => {
    if (isGameOver) return;
    let isDanger = false;
    const bodies = Composite.allBodies(world);
    for (let i = 0; i < bodies.length; i++) {
        const body = bodies[i];
        if (body.label === 'ball' && body !== currentBall &&
            body.position.y - body.circleRadius < dangerLine) {
            if (body.speed < 0.5) {
                isDanger = true;
                break;
            }
        }
    }
    if (isDanger) {
        dangerTimer++;
        dangerLineEl.classList.add('danger');
        if (dangerTimer > 60) gameOver();
    } else {
        dangerTimer = 0;
        dangerLineEl.classList.remove('danger');
    }
});

function gameOver() {
    isGameOver = true;
    dangerLineEl.classList.remove('danger');
    document.getElementById('gameOver').style.display = 'block';
}

document.getElementById('gameOver').addEventListener('click', () => {
    const bodies = Composite.allBodies(world);
    bodies.forEach(body => {
        if (body.label === 'ball') Composite.remove(world, body);
    });
    score = 0;
    document.getElementById('score').innerText = score;
    isGameOver = false;
    dangerTimer = 0;
    dangerLineEl.classList.remove('danger');
    document.getElementById('gameOver').style.display = 'none';
    currentType = Math.floor(Math.random() * 5);
    nextType = Math.floor(Math.random() * 5);
    canDrop = true;
    createReadyBall();
});

Events.on(render, 'afterRender', function() {
    const ctx = render.context;
    const bodies = Composite.allBodies(world);
    
    for (let i = 0; i < bodies.length; i++) {
        const body = bodies[i];
        if (body.label !== 'ball') continue;
        
        const img = loadedImages[body.level];
        if (!img) continue;
        
        const r = body.circleRadius;
        
        ctx.save();
        ctx.translate(body.position.x, body.position.y);
        ctx.rotate(body.angle);
        
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.clip();
        
        const size = Math.min(img.width, img.height);
        const offsetX = (img.width - size) / 2;
        const offsetY = (img.height - size) / 2;
        
        ctx.drawImage(img, offsetX, offsetY, size, size, -r, -r, 2 * r, 2 * r);
        
        ctx.restore();
    }
});

async function initGame() {
    const tasks = ballTypes.map(async (type) => {
        const src = (IMAGE_CONFIG[type.level] || '').trim();
        if (src !== '') {
            const img = await loadImage(src);
            if (img) loadedImages[type.level] = img;
        }
    });
    await Promise.all(tasks);
    createReadyBall();
}

initGame();
</script>
</body>
</html>
