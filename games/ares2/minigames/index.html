<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>睿智小游戏 · 阿瑞斯病毒2 · Jinn Box</title>
<style>
  /* 这里直接复用你主页面的样式 */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1c2440,#0a0d15 60%);
    color:#e8ecf7;min-height:100vh;
  }
  .jinn-header{
    position:fixed;top:0;left:0;right:0;z-index:9999;
    background:rgba(10,13,21,.94);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
    text-align:center;padding:14px 0;
  }
  .jinn-brand{
    font-size:24px;font-weight:900;letter-spacing:6px;
    background:linear-gradient(180deg,#fff,#8ea8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .jinn-nav{
    position:fixed;top:60px;left:0;right:0;z-index:9998;
    display:flex;align-items:center;gap:10px;
    padding:8px 16px;
    background:rgba(10,13,21,.88);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .jinn-back{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#e8ecf7;font-size:13px;font-weight:700;text-decoration:none;
    transition:background .15s;
  }
  .jinn-back:hover{background:rgba(255,255,255,.18)}
  .jinn-page-title{font-size:14px;font-weight:700;opacity:.85}
  .jinn-content{
    padding:132px 24px 48px;
    display:flex;justify-content:center;
  }
  .cards{
    display:flex;flex-wrap:wrap;gap:20px;justify-content:center;
    max-width:760px;
  }
  .card{
    width:200px;padding:28px 20px;border-radius:20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    text-align:center;text-decoration:none;color:inherit;
    transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
  }
  .card:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.09);
    border-color:rgba(120,160,255,.45);
    box-shadow:0 18px 40px rgba(80,110,255,.25);
  }
  .card:active{transform:translateY(-1px) scale(.98)}
  .card .icon{font-size:44px;line-height:1}
  .card .title{font-size:18px;font-weight:800;letter-spacing:1px}
  .jinn-watermark{
    position:fixed;right:16px;bottom:16px;z-index:9997;
    font-size:12px;color:rgba(255,255,255,.15);
    letter-spacing:2px;pointer-events:none;
  }
</style>
</head>
<body>

  <div class="jinn-header">
    <div class="jinn-brand">Jinn Box</div>
  </div>

  <div class="jinn-nav">
    <!-- 注意这里的路径改成了 ../index.html -->
    <a class="jinn-back" href="../index.html">← 返回阿瑞斯病毒2</a>
    <span class="jinn-page-title">睿智小游戏</span>
  </div>

  <div class="jinn-content">
    <div class="cards">
      <!-- 具体的游戏卡片 -->
      <a class="card" href="hcdzz.html">
        <div class="icon">🎮</div>
        <div class="title">hcdzz</div>
      </a>
      
      <!-- 以后有新游戏，在这里继续加 <a> 标签即可 -->
    </div>
  </div>

  <div class="jinn-watermark">Jinn Box</div>

</body>
</html>
