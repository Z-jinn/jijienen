<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>食物图鉴 · Jinn Box</title>
<style>
  /* ===== 基础重置与页面布局 ===== */
  body { 
    margin: 0; 
    padding: 115px 20px 20px !important; /* 留出顶部导航栏的高度 */
    background: #1a1b23; 
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; 
    color: #333; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }
  .main-wrapper { width: 100%; max-width: 750px; }
  
  /* ===== 搜索框 ===== */
  .search-wrapper { margin-bottom: 20px; }
  .search-wrapper input { 
    width: 100%; padding: 14px 20px; border-radius: 8px; 
    border: 1px solid #2f4052; background: #2a2b36; color: #fff; 
    font-size: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
    outline: none; transition: 0.2s; 
  }
  .search-wrapper input::placeholder { color: #6a6b7c; }
  .search-wrapper input:focus { border-color: #6a5b8e; box-shadow: 0 0 10px rgba(106, 91, 142, 0.5); }
  
  /* ===== 食物列表 ===== */
  .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
  .grid-item { 
    background: #2a2b36; border: 1px solid #3b3c4a; border-radius: 10px; 
    padding: 15px; display: flex; flex-direction: column; align-items: center; 
    cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
  }
  .grid-item:hover { transform: translateY(-3px); border-color: #6a5b8e; box-shadow: 0 8px 20px rgba(106, 91, 142, 0.4); background: #32333f; }
  .grid-img-box { width: 80px; height: 80px; background: #1a1b23; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .grid-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .grid-img-box .placeholder { font-size: 12px; color: #6a6b7c; }
  .grid-name { color: #fff; font-size: 14px; font-weight: bold; text-align: center; word-break: break-all; }
  .no-result { grid-column: 1 / -1; text-align: center; padding: 40px; color: #8aa0b5; font-size: 16px; background: #2a2b36; border-radius: 12px; }

  /* ===== 弹窗 ===== */
  .food-modal { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0, 0, 0, 0.85); display: none; align-items: center; 
    justify-content: center; z-index: 99999 !important; /* 提高层级，防被导航遮挡 */
    padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
  }
  .food-modal.show { display: flex; }
  .food-card { 
    background: #eaebf0; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
    width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; 
    border: 1px solid #b0b1c0; position: relative; 
  }
  .food-card::-webkit-scrollbar { width: 6px; }
  .food-card::-webkit-scrollbar-thumb { background: #6a5b8e; border-radius: 3px; }
  
  .food-header { background: #6a5b8e; color: #fff; text-align: center; padding: 12px; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
  .food-header .close-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 24px; cursor: pointer; color: #d3cae5; transition: 0.2s; }
  .food-header .close-btn:hover { color: #fff; }
  
  .food-content { padding: 20px; }
  .food-top { display: flex; align-items: center; margin-bottom: 15px; }
  .food-img-box { width: 100px; height: 100px; background: #fff; border: 1px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; }
  .food-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .food-img-box .placeholder { font-size: 14px; color: #aaa; }
  .food-info-basic { font-size: 15px; line-height: 1.8; color: #333; }
  .food-info-basic span { font-weight: bold; color: #111; }
  
  .food-effects { font-size: 15px; line-height: 1.8; color: #333; margin-bottom: 10px; }
  .food-effect-title { color: #2e8b57; font-weight: bold; }
  .food-effect-desc { color: #2e8b57; font-weight: bold; white-space: pre-wrap; } /* 支持换行 */
  
  .food-extra { font-size: 14px; color: #e64b4b; margin-bottom: 15px; font-weight: bold; }

  /* 获取途径与制造条件样式 */
  .food-source-box { background: #dcdde3; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 14px; color: #333; }
  .food-source-label { color: #666; font-weight: bold; margin-bottom: 5px; display: block; }
  
  .material-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .material-item { display: flex; justify-content: space-between; align-items: center; background: #c5c6d0; padding: 8px 12px; border-radius: 6px; }
  .material-name { color: #333; font-weight: bold; }
  .material-count { color: #111; font-weight: bold; background: #fff; padding: 2px 8px; border-radius: 4px; font-size: 13px; }

  /* ===== Jinn Box 终极统一导航栏 ===== */
  .jinn-top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(10,13,21,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px;
  }
  .jinn-brand {
    font-size: 22px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg,#fff,#8ea8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .jinn-nav {
    display: flex; align-items: center; gap: 12px; 
    width: 100%; max-width: 750px;
  }
  .jinn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    color: #e8ecf7 !important; font-size: 13px; font-weight: 700; 
    text-decoration: none !important; transition: 0.2s;
  }
  .jinn-back:hover { background: rgba(255,255,255,.18); }
  .jinn-page-title { font-size: 14px; font-weight: 700; color: #e8ecf7; }

</style>

function renderGrid(data = foodData) {
  const grid = document.getElementById('food-grid');
  if (!grid) return;
  if (data.length === 0) {
    grid.innerHTML = '<div class="no-result">未找到匹配的食物，请尝试其他关键字。</div>';
    return;
  }
  let html = '';
  data.forEach((food) => {
    let imgHtml = '';
    if (food.imgUrl && food.imgUrl.trim() !== "") {
      imgHtml = `<img src="${food.imgUrl}" alt="${food.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>暂无图片</span>';">`;
    } else {
      imgHtml = `<span class="placeholder">暂无图片</span>`;
    }
    html += `<div class="grid-item" onclick="openFoodDetail('${food.name}')"><div class="grid-img-box">${imgHtml}</div><div class="grid-name">${food.name}</div></div>`;
  });
  grid.innerHTML = html;
}

  } else {
    imgHtml = `<span class="placeholder">暂无图片</span>`;
  }

  let extraHtml = food.extraDesc ? `<div class="food-extra">${food.extraDesc}</div>` : '';

  // 基础数值显示逻辑（有的食物/药品没有饥饿值）
  let statHtml = '';
  if (food.statValue) {
    statHtml = `<div class="food-info-basic">${food.statType || '数值'}：<span>${food.statValue}</span></div>`;
  }

  // 效果显示逻辑（有的食物没有效果）
  let effectHtml = '';
  if (food.effectTitle || food.effectDesc) {
    effectHtml = `
      <div class="food-effects">
        <span class="food-effect-title">${food.effectTitle || ''}</span>
        <span class="food-effect-desc">${food.effectDesc || ''}</span>
      </div>
    `;
  }

  // 获取途径与制造条件逻辑
  let sourceHtml = '';
  if (food.source) {
    let matHtml = '';
    if (food.materials && food.materials.length > 0) {
      matHtml += `<div class="material-list">`;
      food.materials.forEach(m => {
        matHtml += `
          <div class="material-item">
            <span class="material-name">${m.name}</span>
            <span class="material-count">x${m.count}</span>
          </div>
        `;
      });
      matHtml += `</div>`;
    }
    
    sourceHtml = `
      <div class="food-source-box">
        <span class="food-source-label">获取途径：</span>
        ${food.source}
        ${matHtml}
      </div>
    `;
  }

  const modalCard = document.getElementById('modalCard');
  modalCard.innerHTML = `
    <div class="food-header">${food.name}<span class="close-btn" onclick="closeModal()">×</span></div>
    <div class="food-content">
      <div class="food-top">
        <div class="food-img-box">${imgHtml}</div>
        <div>
          ${statHtml}
          ${extraHtml}
        </div>
      </div>
      
      ${effectHtml}
      ${sourceHtml}
      
    </div>
  `;

  document.getElementById('foodModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('foodModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  const keyword = e.target.value.toLowerCase().trim();
  const filteredData = foodData.filter(food => food.name.toLowerCase().includes(keyword));
  renderGrid(filteredData);
});

window.onload = () => renderGrid();
</script>

</body>
</html>
