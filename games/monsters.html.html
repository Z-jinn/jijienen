<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>怪物图鉴 · Jinn Box</title>
<style>
  /* ===== 基础重置与页面布局 ===== */
  body { 
    margin: 0; 
    padding: 115px 20px 20px !important; /* 留出顶部导航的高度 */
    background: #1a1b23; 
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; 
    color: #333; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }
  .main-wrapper { width: 100%; max-width: 750px; }
  
  /* ===== 搜索框 ===== */
  .search-wrapper { margin-bottom: 20px; }
  .search-wrapper input { 
    width: 100%; padding: 14px 20px; border-radius: 8px; 
    border: 1px solid #2f4052; background: #2a2b36; color: #fff; 
    font-size: 15px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
    outline: none; transition: 0.2s; 
  }
  .search-wrapper input::placeholder { color: #6a6b7c; }
  .search-wrapper input:focus { border-color: #6a5b8e; box-shadow: 0 0 10px rgba(106, 91, 142, 0.5); }
  
  /* ===== 怪物列表 ===== */
  .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
  .grid-item { 
    background: #2a2b36; border: 1px solid #3b3c4a; border-radius: 10px; 
    padding: 15px; display: flex; flex-direction: column; align-items: center; 
    cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
  }
  .grid-item:hover { transform: translateY(-3px); border-color: #6a5b8e; box-shadow: 0 8px 20px rgba(106, 91, 142, 0.4); background: #32333f; }
  .grid-img-box { width: 80px; height: 80px; background: #1a1b23; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .grid-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .grid-img-box .placeholder { font-size: 12px; color: #6a6b7c; }
  .grid-name { color: #fff; font-size: 14px; font-weight: bold; text-align: center; word-break: break-all; }
  .no-result { grid-column: 1 / -1; text-align: center; padding: 40px; color: #8aa0b5; font-size: 16px; background: #2a2b36; border-radius: 12px; }

  /* ===== 弹窗 ===== */
  .monster-modal { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0, 0, 0, 0.85); display: none; align-items: center; 
    justify-content: center; z-index: 99999 !important; /* 提高层级，防被导航遮挡 */
    padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
  }
  .monster-modal.show { display: flex; }
  .monster-card { 
    background: #eaebf0; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
    width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; 
    border: 1px solid #b0b1c0; position: relative; 
  }
  .monster-card::-webkit-scrollbar { width: 6px; }
  .monster-card::-webkit-scrollbar-thumb { background: #6a5b8e; border-radius: 3px; }
  .monster-header { background: #6a5b8e; color: #fff; text-align: center; padding: 12px; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
  .monster-header .close-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 24px; cursor: pointer; color: #d3cae5; transition: 0.2s; }
  .monster-header .close-btn:hover { color: #fff; }
  
  .monster-top { display: grid; grid-template-columns: 130px 1fr; gap: 15px; padding: 15px; background: #f4f5f9; border-bottom: 1px solid #d0d1db; }
  .monster-img-box { width: 130px; height: 130px; background: #fff; border: 1px solid #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .monster-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .monster-img-box .placeholder { font-size: 14px; color: #aaa; }
  
  .monster-stats { display: flex; flex-direction: column; justify-content: center; gap: 6px; font-size: 13px; }
  .stat-item { display: flex; border-bottom: 1px dashed #d0d1db; padding-bottom: 4px; }
  .stat-item .label { color: #666; min-width: 75px; }
  .stat-item .value { color: #111; font-weight: bold; flex: 1; }
  
  .monster-section { padding: 15px; background: #eaebf0; font-size: 14px; line-height: 1.8; }
  .monster-section:last-child { border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
  .section-title { color: #6a5b8e; font-weight: bold; margin-bottom: 10px; font-size: 15px; border-bottom: 1px solid #d0d1db; padding-bottom: 6px; }
  
  .skill-item { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #d0d1db; }
  .skill-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
  .skill-name { color: #3b7bc3; font-weight: bold; display: inline-block; margin-bottom: 2px; }
  .skill-desc { color: #444; display: block; }
  
  .strategy-text { color: #444; white-space: pre-wrap; }
  .drops-text { color: #444; }
  
  /* ===== Jinn Box 终极统一导航栏 ===== */
  .jinn-top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(10,13,21,.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px;
  }
  .jinn-brand {
    font-size: 22px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg,#fff,#8ea8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .jinn-nav {
    display: flex; align-items: center; gap: 12px; 
    width: 100%; max-width: 750px;
  }
  .jinn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    color: #e8ecf7 !important; font-size: 13px; font-weight: 700; 
    text-decoration: none !important; transition: 0.2s;
  }
  .jinn-back:hover { background: rgba(255,255,255,.18); }
  .jinn-page-title { font-size: 14px; font-weight: 700; color: #e8ecf7; }

  @media (max-width: 600px) { 
    .monster-top { grid-template-columns: 1fr; justify-items: center; } 
    .monster-stats { width: 100%; } 
  }
</style>
</head>
<body>

<!-- ================= 这里必须是 body 内的第一段代码 ================= -->
<div class="jinn-top-bar">
  <div class="jinn-brand">Jinn Box</div>
  <div class="jinn-nav">
    <a class="jinn-back" href="index.html">← 返回</a>
    <span class="jinn-page-title">怪物图鉴</span>
  </div>

<!-- ================================================================= -->

<div class="main-wrapper">

<div class="monster-modal" id="monsterModal" onclick="if(event.target === this) closeModal()">

function renderGrid(data = monsterData) {
  const grid = document.getElementById('monster-grid');
  if (!grid) return;
  if (data.length === 0) {
    grid.innerHTML = '<div class="no-result">未找到匹配的怪物，请尝试其他关键字。</div>';
    return;
  }
  let html = '';
  data.forEach((monster) => {
    let imgHtml = '';
    if (monster.imgUrl && monster.imgUrl.trim() !== "") {
      imgHtml = `<img src="${monster.imgUrl}" alt="${monster.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>暂无图片</span>';">`;
    } else {
      imgHtml = `<span class="placeholder">暂无图片</span>`;
    }
    html += `<div class="grid-item" onclick="openMonsterDetail('${monster.name}')"><div class="grid-img-box">${imgHtml}</div><div class="grid-name">${monster.name}</div></div>`;
  });
  grid.innerHTML = html;
}

function openMonsterDetail(monsterName) {
  const monster = monsterData.find(m => m.name === monsterName);
  if (!monster) return;

  let imgHtml = '';
  if (monster.imgUrl && monster.imgUrl.trim() !== "") {
    imgHtml = `<img src="${monster.imgUrl}" alt="${monster.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>暂无图片</span>';">`;
  } else {
    imgHtml = `<span class="placeholder">暂无图片</span>`;
  }

  let statsHtml = `
    <div class="stat-item"><span class="label">血量</span><span class="value">${monster.hp || '--'}</span></div>
    <div class="stat-item"><span class="label">攻击力</span><span class="value">${monster.attack || '--'}</span></div>
    <div class="stat-item"><span class="label">减伤</span><span class="value">${monster.damageReduction || '--'}</span></div>
  `;

  let skillsHtml = '';
  if (monster.skills && monster.skills.length > 0) {
    monster.skills.forEach((s) => {
      skillsHtml += `<div class="skill-item"><span class="skill-name">${s.name}</span><span class="skill-desc">${s.desc}</span></div>`;
    });
  } else {
    skillsHtml = '<div class="skill-item" style="color:#999;">暂无技能信息</div>';
  }

  let dropsHtml = '';
  if (monster.drops) {
    dropsHtml = `<div class="drops-text">${monster.drops.replace(/\n/g, '<br>')}</div>`;
  } else {
    dropsHtml = '<div class="drops-text" style="color:#999;">暂无掉落物</div>';
  }

  let strategyHtml = '';
  if (monster.strategy) {
    let formattedStrategy = monster.strategy.replace(/\n/g, '<br>');
    strategyHtml = `<div class="strategy-text">${formattedStrategy}</div>`;
  } else {
    strategyHtml = '<div class="strategy-text" style="color:#999;">暂无打法建议</div>';
  }

  const modalCard = document.getElementById('modalCard');
  modalCard.innerHTML = `
    <div class="monster-header">${monster.name}<span class="close-btn" onclick="closeModal()">×</span></div>
    <div class="monster-top">
      <div class="monster-img-box">${imgHtml}</div>
      <div class="monster-stats">${statsHtml}</div>
    </div>
    <div class="monster-section">
      <div class="section-title">技能详情</div>
      ${skillsHtml}
    </div>
    <div class="monster-section" style="border-top: 1px solid #d0d1db; padding-top: 15px;">
      <div class="section-title">掉落物</div>
      ${dropsHtml}
    </div>
    <div class="monster-section" style="border-top: 1px solid #d0d1db; padding-top: 15px;">
      <div class="section-title">打法建议</div>
      ${strategyHtml}
    </div>
  `;

  document.getElementById('monsterModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('monsterModal').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  const keyword = e.target.value.toLowerCase().trim();
  const filteredData = monsterData.filter(monster => monster.name.toLowerCase().includes(keyword));
  renderGrid(filteredData);
});

window.onload = () => renderGrid();
</script>

</body>
</html>
