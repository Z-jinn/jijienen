<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jinn Box</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#1c2440,#0a0d15 60%);
  color:#e8ecf7;
  display:flex;flex-direction:column;
  min-height:100vh;
}
.jinn-header{flex:none;padding:20px 16px 0;text-align:center}
.jinn-brand{
  font-size:34px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#fff,#8ea8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.jinn-nav{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  background:rgba(255,255,255,.04);
  border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);
}
.jinn-page-title{font-size:15px;font-weight:700;opacity:.85}
.jinn-content{
  flex:1;overflow:auto;
  padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;gap:28px;
}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:760px}
.card{
  width:200px;padding:28px 20px;border-radius:20px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  min-height:168px;
  cursor:pointer;text-align:center;text-decoration:none;color:inherit;
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
}
.card:hover{
  transform:translateY(-4px);background:rgba(255,255,255,.09);
  border-color:rgba(120,160,255,.45);box-shadow:0 18px 40px rgba(80,110,255,.25);
}
.card:active{transform:translateY(-1px) scale(.98)}
.card .icon{
  width:76px;height:76px;display:block;
  border-radius:18px;
  object-fit:cover;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform .18s;
}
.card:hover .icon{transform:scale(1.06)}
.card .title{font-size:18px;font-weight:800;letter-spacing:1px}
.footer{font-size:12px;color:#4d5566;letter-spacing:1px;text-align:center;padding:16px 0 24px}
</style>
</head>
<body>

<div class="jinn-header">
  <div class="jinn-brand">Jinn Box</div>
</div>

<div class="jinn-nav">
  <span class="jinn-page-title">工具箱</span>
</div>

<div class="jinn-content">
  <div class="cards">

    <!-- 阿瑞斯病毒2 -->
    <a class="card" href="games/ares2/index.html">
      <img class="icon" src="images/ares2.jpg" alt="阿瑞斯病毒2">
      <div class="title">阿瑞斯病毒2</div>
    </a>

  </div>

  <div class="footer">© Jinn Box</div>
</div>

</body>
</html>
